<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0820"/>
      <stop offset="0.55" stop-color="#1c1747"/>
      <stop offset="1" stop-color="#2d1b69"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#6c5ce7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6c5ce7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <style>
      .name{font:800 62px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:3px;fill:#fff}
      .role{font:600 20px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:4px;fill:url(#accent)}
      .tag{font:400 16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c4b5fd;fill-opacity:.85}
      .chip{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e9e5ff}
      .fade{opacity:0;animation:in 1s ease forwards}
      .d1{animation-delay:.1s}.d2{animation-delay:.5s}.d3{animation-delay:.9s}.d4{animation-delay:1.3s}
      .scan{animation:scan 5s linear infinite}
      .blink{animation:blink 1.1s steps(1) infinite}
      @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      @keyframes scan{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>
  <rect class="scan" x="0" y="0" width="3" height="320" fill="#a78bfa" fill-opacity="0.35"/>

  <text class="name fade d1" x="70" y="132">VŨ CAO NGUYÊN</text>
  <text class="role fade d2" x="72" y="174">MOBILE ENGINEER  ·  SECURITY-MINDED</text>
  <text class="tag fade d3" x="72" y="212">$ build --native --secure --ship<tspan class="blink" fill="#22d3ee"> ▌</tspan></text>

  <g class="fade d4">
    <rect x="72" y="244" width="92" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text class="chip" x="118" y="264" text-anchor="middle">Swift</text>
    <rect x="176" y="244" width="92" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text class="chip" x="222" y="264" text-anchor="middle">Kotlin</text>
    <rect x="280" y="244" width="72" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text class="chip" x="316" y="264" text-anchor="middle">C++</text>
    <rect x="364" y="244" width="160" height="30" rx="15" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.7"/>
    <text class="chip" x="444" y="264" text-anchor="middle">Cybersecurity</text>
  </g>

  <g transform="translate(930 70)" opacity="0.9">
    <rect width="190" height="190" rx="22" fill="#ffffff" fill-opacity="0.05" stroke="#a78bfa" stroke-opacity="0.45"/>
    <path d="M95 34 L146 54 V98 C146 128 124 150 95 162 C66 150 44 128 44 98 V54 Z" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linejoin="round"/>
    <rect x="76" y="88" width="38" height="30" rx="5" fill="url(#accent)"/>
    <path d="M83 88 V78 a12 12 0 0 1 24 0 V88" fill="none" stroke="url(#accent)" stroke-width="5"/>
  </g>
</svg>
